<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YUWA</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="YUWA. Die Website entsteht gerade.">
<link rel="icon" href="assets/yuwa-monogramm-kobalt.svg" type="image/svg+xml">
<style>
  :root {
    --flaeche: #FFFFFF;
    --ink: #172231;
    --kobalt: #024BB9;
    --sekundaer: #53606E;
    --rand: clamp(1.25rem, 4vw, 3.5rem);
    --t-klein: 180ms;
    --kurve: cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--flaeche);
    color: var(--ink);
  }

  body {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    padding: var(--rand);
    font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  :focus-visible {
    outline: 2px solid var(--kobalt);
    outline-offset: 4px;
    border-radius: 2px;
  }

  /* ---------- Kopfzeile: Wortmarke links, Instagram rechts ---------- */

  .kopf {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1.5rem;
  }

  .marke { display: block; width: clamp(104px, 15vw, 190px); }
  .marke img { display: block; width: 100%; height: auto; }

  /* Instagram: nur Wort und Pfeil, kein Verlauf, kein Button. */
  .insta {
    display: inline-flex;
    align-items: baseline;
    gap: 0.3em;
    padding: 0.5rem 0.15rem;
    font-size: clamp(0.8125rem, 1.6vw, 0.9375rem);
    letter-spacing: 0.01em;
    color: var(--sekundaer);
    text-decoration: none;
    white-space: nowrap;
    transition: color var(--t-klein) var(--kurve);
    will-change: transform;
  }

  .insta:hover,
  .insta:focus-visible { color: var(--ink); }

  .insta .pfeil {
    font-size: 0.85em;
    transition: transform var(--t-klein) var(--kurve);
  }

  .insta:hover .pfeil { transform: translate(1px, -1px); }

  /* ---------- Illustration ---------- */

  .buehne {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    padding: clamp(1rem, 3vh, 2.5rem) 0 clamp(2rem, 6vh, 4rem);
  }

  /* Die Zeichnung ist hochformatig (829.83 : 944.57). Ihre Breite haengt
     zusaetzlich an der Fensterhoehe, sonst waechst sie auf flachen
     Bildschirmen unten aus dem Bild. */
  .illu {
    width: min(100%, 480px, 62svh);
    max-height: 100%;
    aspect-ratio: 829.83 / 944.57;
  }

  .illu > svg { display: block; width: 100%; height: 100%; }

  @media (max-width: 640px) {
    .buehne { padding: 0 0 clamp(1.5rem, 5vh, 3rem); }
    .illu { width: min(100%, 70svh); }
  }

  @media (prefers-reduced-motion: reduce) {
    .insta, .insta .pfeil { transition-duration: 1ms; }
  }
</style>
</head>

    </a>

<script>
(function () {
  'use strict';

  /* Instagram: sehr zurueckhaltender magnetischer Link.
     Nur auf Geraeten mit echtem Zeiger, nicht auf Touch, nicht bei
     reduzierter Bewegung. Ohne Bibliothek, maximal 4 px Ausschlag. */
  var insta = document.getElementById('insta');
  var zeiger = window.matchMedia('(hover: hover) and (pointer: fine)');
  var wenigerBewegung = window.matchMedia('(prefers-reduced-motion: reduce)');
  var rahmen = null;

  insta.addEventListener('pointermove', function (e) {
    if (!zeiger.matches || wenigerBewegung.matches) return;
    if (rahmen) return;
    rahmen = window.requestAnimationFrame(function () {
      rahmen = null;
      var kasten = insta.getBoundingClientRect();
      var dx = e.clientX - (kasten.left + kasten.width / 2);
      var dy = e.clientY - (kasten.top + kasten.height / 2);
      var grenze = 4;
      var x = Math.max(-grenze, Math.min(grenze, dx * 0.22));
      var y = Math.max(-grenze, Math.min(grenze, dy * 0.35));
      insta.style.transition = 'transform 120ms linear, color var(--t-klein) var(--kurve)';
      insta.style.transform = 'translate(' + x.toFixed(2) + 'px, ' + y.toFixed(2) + 'px)';
    });
  });

  insta.addEventListener('pointerleave', function () {
    insta.style.transition = 'transform var(--t-klein) var(--kurve), color var(--t-klein) var(--kurve)';
    insta.style.transform = '';
  });
})();
</script>
